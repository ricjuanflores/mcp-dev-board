[project]
name = "ai-dev-board-backend"
version = "0.1.0"
description = "AI Dev Board"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<7",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.6.0",
    "psycopg[binary]>=3.2",
    "google-genai>=1.72.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core"]

[dependency-groups]
dev = [
    "ruff>=0.6.2",
    "djangorestframework-stubs>=3.17.0",
]
